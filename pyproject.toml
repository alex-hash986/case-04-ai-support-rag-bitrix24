[project]
name = "case-04-ai-support-rag-bitrix24"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi", "uvicorn", "streamlit", "httpx", "pydantic-settings>=2.8",
    "pyyaml", "filelock", "snowballstemmer",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "mypy", "types-PyYAML"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*", "scripts*", "ops*"]

[tool.pytest.ini_options]
pythonpath = ['.']
addopts = '--basetemp=.case04-pytest-temp'

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]


